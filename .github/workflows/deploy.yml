name: Deploy Obiasnarium
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published site
        env:
          # Test the stable GitHub Pages origin while a custom domain's DNS is propagating.
          PAGES_URL: https://queene189123-ai.github.io/obyasnyarium/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 5 "$PAGES_URL" -o /tmp/obyasnyarium.html
          grep -q '<title>Объясняриум</title>' /tmp/obyasnyarium.html
          grep -q 'Создать комнату' /tmp/obyasnyarium.html
          grep -q "rpc('create_room'" /tmp/obyasnyarium.html
          echo "Published page is reachable and contains the online-room entry points."
