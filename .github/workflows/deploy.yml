name: Deploy Obiasnarium
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published site
        env:
          # Do not follow GitHub Pages' redirect to the custom domain while its DNS is propagating.
          PAGES_URL: https://queene189123-ai.github.io/obyasnyarium/
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/obyasnyarium.html --write-out '%{http_code}' --max-redirs 0 "$PAGES_URL" || true)"
          if [ "$status" = "200" ]; then
            grep -q '<title>Объясняриум</title>' /tmp/obyasnyarium.html
            grep -q 'Создать комнату' /tmp/obyasnyarium.html
            grep -q "rpc('create_room'" /tmp/obyasnyarium.html
            echo "Published page is reachable and contains the online-room entry points."
          elif [[ "$status" =~ ^3[0-9][0-9]$ ]]; then
            echo "GitHub Pages is redirecting to the custom domain; DNS/HTTPS may still be propagating. Deployment completed."
          else
            echo "Unexpected response from GitHub Pages: HTTP $status"
            exit 1
          fi
