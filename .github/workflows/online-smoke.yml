name: Online two-browser smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "tests/online-smoke.cjs"
      - "supabase/migrations/**"
      - ".github/workflows/online-smoke.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/online-smoke.cjs"
      - "supabase/migrations/**"
      - ".github/workflows/online-smoke.yml"
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-browser-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Serve the checked-out build for pull-request testing
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 > /tmp/obyasnyarium-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
      - name: Test online game in two isolated browsers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_URL=http://127.0.0.1:4173/ node tests/online-smoke.cjs
          else
            node tests/online-smoke.cjs
          fi
