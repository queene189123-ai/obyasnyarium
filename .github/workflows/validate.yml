name: Validate game JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No script blocks found in index.html")
          for i, source in enumerate(scripts):
              Path(f"/tmp/obyasnyarium-script-{i}.js").write_text(source, encoding="utf-8")
          print(f"Found {len(scripts)} script blocks")
          PY
          for file in /tmp/obyasnyarium-script-*.js; do
            node --check "$file"
          done
      - name: Check basic HTML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          if not html.rstrip().lower().endswith("</html>"):
              raise SystemExit("index.html does not end with </html>")
          if html.lower().count("<script") != html.lower().count("</script>"):
              raise SystemExit("Script tag count mismatch")
          from html.parser import HTMLParser
          class IdChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.duplicates = set()
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          if value in self.ids:
                              self.duplicates.add(value)
                          self.ids.add(value)
          checker = IdChecker()
          checker.feed(html)
          if checker.duplicates:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(sorted(checker.duplicates)))
          print("Basic HTML structure and element IDs look consistent")
          required = [
              "async function onlineSave(",
              "async function onlineSync(",
              "async function onlineStartGame(",
              "async function onlineAwardPoint(",
              "async function onlineRematch(",
              "function onlineSubscribe(",
              "window.addEventListener('offline'",
              "window.addEventListener('online'",
              "let onlinePollGeneration = 0;",
              "let onlineVisibilityHandler = null;",
              "let onlineNetworkHandlersInstalled = false;",
              "if(!onlineNetworkHandlersInstalled){",
              "Leaving the screen must not hang while waiting for a flaky network.",
              "supabaseClient.rpc('leave_room', {",
              "A response from an old room/session must never affect the current screen.",
              "requestPlayerToken=online.playerToken",
              "requestPlayerToken!==online.playerToken",
              "async function onlineSync()",
              "async function onlineSave()",
              "const recoverLatestState=async()=>",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing critical online-game code: " + ", ".join(missing))
          if "if(!online.lastSaveConflict) online.state=previousState;" not in html:
              raise SystemExit("Missing conflict-safe rollback guard")
          sync_start = html.index("async function onlineSync()")
          sync_end = html.index("async function onlineSave()", sync_start)
          sync_code = html[sync_start:sync_end]
          if "pollGeneration!==onlinePollGeneration" not in sync_code or "if(pollGeneration===onlinePollGeneration) online.pollBusy=false" not in sync_code:
              raise SystemExit("Missing stale-subscription response guards")
          sync_catch = sync_code[sync_code.index("} catch(e) {"):sync_code.index("} finally {")]
          if "requestRoomId===online.roomId" not in sync_catch or "requestPlayerToken===online.playerToken" not in sync_catch:
              raise SystemExit("Stale polling errors must not change the active room connection status")
          save_start = html.index("async function onlineSave()")
          save_end = html.index("async function onlineFinishGame()", save_start)
          save_code = html[save_start:save_end]
          if "const recoverLatestState=async()=>{" not in save_code or "if(!isSameSession()) return false;" not in save_code:
              raise SystemExit("Missing guarded recovery of server state")
          if "finally {\n    if(isSameSession()) online.saving=false;\n  }" not in save_code:
              raise SystemExit("Missing session-safe save lock release")
          # Guard the most important shared-game transitions against accidental regressions.
          def function_body(signature, next_signature):
              start = html.index(signature)
              end = html.index(next_signature, start)
              return html[start:end]
          # Every optimistic state transition must preserve the server-recovered state on a version conflict.
          rollback_handlers = [
              ("async function onlineStartGame()", "function onlineRenderState()"),
              ("async function onlineShowWord()", "function renderOnlineWord()"),
              ("async function onlineShowGuess()", "function renderOnlineGuess()"),
              ("async function onlineAwardPoint(", "function renderOnlineResult()"),
              ("async function onlineContinueAfterResult()", "async function onlineReplaceWord()"),
              ("async function onlineReplaceWord()", "async function onlineNextPlayer()"),
              ("async function onlineNextPlayer()", "function onlineNextState()"),
              ("async function onlineBackToLobby()", "function renderOnlineLobby()"),
              ("async function onlineRematch()", "function launchConfetti()"),
          ]
          for start_signature, end_signature in rollback_handlers:
              body = function_body(start_signature, end_signature)
              if "await onlineSave()" not in body or "lastSaveConflict" not in body:
                  raise SystemExit("State transition lacks conflict-safe save/rollback handling: " + start_signature)
          award = function_body("async function onlineAwardPoint(", "function renderOnlineResult()")
          if "online.state.status!=='guess'" not in award or "onlineCurrentPlayer()?.id!==online.playerId" not in award:
              raise SystemExit("Only the active explainer may award a point during the guess phase")
          if "current.id===guesser.id" not in award or "online.state.status='result'" not in award:
              raise SystemExit("Point awarding must reject self-guessing and immediately close the guess phase")
          start_game = function_body("async function onlineStartGame()", "function onlineRenderState()")
          if "online.playerId!==online.hostId" not in start_game or "players.length < 2" not in start_game:
              raise SystemExit("Game start must be host-only and require at least two players")
          finish_game = function_body("async function onlineFinishGame()", "function renderOnlineFinish()")
          if "online.playerId!==online.hostId" not in finish_game or "online.state.status='finished'" not in finish_game:
              raise SystemExit("Finishing the game must be host-only and update shared status")
          rematch = function_body("async function onlineRematch()", "function launchConfetti()")
          if "online.playerId!==online.hostId" not in rematch or "online.state.status!=='finished'" not in rematch or "getOnlinePlayers().length<2" not in rematch:
              raise SystemExit("Rematch must be host-only, follow a finished game, and require two players")
          restore = function_body("async function restoreOnlineSession(", "let onlinePollGeneration = 0;")
          if "online.roomId===saved.roomId && online.playerToken===saved.playerToken && online.playerId===saved.playerId && online.state" not in restore:
              raise SystemExit("Session fast path must match exact room and player credentials")
          for marker in ["saved.roomId", "saved.playerToken", "saved.playerId", "rpc('get_room_state'", "onlineSubscribe()"]:
              if marker not in restore:
                  raise SystemExit("Session restoration is missing required step: " + marker)
          for marker in ["if(online.pollTimer) clearInterval(online.pollTimer);", "onlinePollGeneration++", "const isCurrentRestore=()=>", "if(!isCurrentRestore()) return false;"]:
              if marker not in restore:
                  raise SystemExit("Session restoration must cancel old timers and reject stale responses: " + marker)
          join = function_body("async function onlineJoinRoomInternal(", "let onlineEntryBusy = false;")
          for marker in ["code.length !== 5", "rpc('join_room'", "Array.isArray(joinedState.players)", "cleanUrl.searchParams.delete('room')", "history.replaceState(null,'',cleanUrl.pathname+cleanUrl.search+cleanUrl.hash)", "saveOnlineSession()"]:
              if marker not in join:
                  raise SystemExit("Room joining is missing required validation: " + marker)
          if "if(onlineEntryBusy) return;" not in html:
              raise SystemExit("Missing duplicate room-entry request guard")
          if "Не удалось создать комнату из-за ошибки соединения" not in html or "Не удалось войти в комнату из-за ошибки соединения" not in html:
              raise SystemExit("Room entry must show a friendly message when a network call throws")
          if "finally {\n    onlineEntryBusy=false;\n  }" not in html:
              raise SystemExit("Room entry lock must always release after a thrown network error")
          if 'params.get("room")' not in html or r'/^\d{5}$/.test(roomCode)' not in html:
              raise SystemExit("Invitation links must accept only five-digit room codes")
          offline_restore = function_body("function restoreOfflineGame()", "// ===== ОФЛАЙН: ИГРОКИ =====")
          if "saved.players.length < 1" not in offline_restore:
              raise SystemExit("Offline restore must reject saves without players")
          if "Math.min(Math.max(saved.currentIdx, 0), saved.players.length - 1)" not in offline_restore:
              raise SystemExit("Offline restore must clamp the active player index to saved players")
          if "saved.round > 0 ? saved.round : 1" not in offline_restore:
              raise SystemExit("Offline restore must reject invalid round numbers")
          # Optimistic version checks must prevent two clients from overwriting each other's turns or scores.
          if "p_expected_version:online.version" not in save_code or "VERSION_CONFLICT" not in save_code:
              raise SystemExit("Online saves must use server-side version checks and detect conflicts")
          if "Number(data.version) < Number(online.version || 0)" not in sync_code:
              raise SystemExit("Polling must not overwrite a newer game state with an older server response")
          award = function_body("async function onlineAwardPoint(", "function renderOnlineResult()")
          for marker in ["current.score=(current.score||0)+1", "guesser.score=(guesser.score||0)+1", "online.state.status='result'", "online.state.selectedGuesserId=guesser.id"]:
              if marker not in award:
                  raise SystemExit("Scoring transition is missing required update: " + marker)
          join = function_body("async function onlineJoinRoomInternal(", "let onlineEntryBusy = false;")
          for marker in ["joiningDifferentInvite", "inviteCode!==String(saved.code||'')", "localStorage.removeItem(ONLINE_SESSION_KEY)"]:
              if marker not in join:
                  raise SystemExit("Joining a different invitation must not restore the previous room: " + marker)
          print("Online turn, scoring, rematch, session recovery, and invite checks passed")
          print("Critical online-game handlers and conflict guard are present")
          PY
