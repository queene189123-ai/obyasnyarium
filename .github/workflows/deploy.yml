name: Deploy Obiasnarium
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Diagnose and smoke-test published site
        env:
          PAGES_URL: https://queene189123-ai.github.io/obyasnyarium/
          CUSTOM_URL: https://obyasnyarium.ru/
        run: |
          set -euo pipefail
          echo "GitHub Pages deployment URL: ${{ steps.deployment.outputs.page_url }}"
          if [ -f CNAME ]; then
            echo "Repository CNAME file: $(cat CNAME)"
          else
            echo "Repository CNAME file: absent"
          fi
          for url in "$PAGES_URL" "$CUSTOM_URL"; do
            echo "Checking $url"
            curl --silent --show-error --output /tmp/obyasnyarium-response.html --write-out 'HTTP %{http_code}; redirect=%{redirect_url}; remote_ip=%{remote_ip}\n' --max-time 20 --max-redirs 0 "$url" || true
          done
          status="$(curl --silent --show-error --output /tmp/obyasnyarium.html --write-out '%{http_code}' --max-time 20 --max-redirs 0 "$PAGES_URL" || true)"
          if [ "$status" = "200" ]; then
            grep -q '<title>Объясняриум</title>' /tmp/obyasnyarium.html
            grep -q 'Создать комнату' /tmp/obyasnyarium.html
            grep -q "rpc('create_room'" /tmp/obyasnyarium.html
            echo "Published page is reachable and contains the online-room entry points."
          elif [[ "$status" =~ ^3[0-9][0-9]$ ]]; then
            echo "GitHub Pages redirects to another host. See diagnostic redirect above."
          else
            echo "GitHub Pages did not return a direct 200 response (HTTP $status); see diagnostics above."
            exit 1
          fi
