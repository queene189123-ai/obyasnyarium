name: Validate game JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No script blocks found in index.html")
          for i, source in enumerate(scripts):
              Path(f"/tmp/obyasnyarium-script-{i}.js").write_text(source, encoding="utf-8")
          print(f"Found {len(scripts)} script blocks")
          PY
          for file in /tmp/obyasnyarium-script-*.js; do
            node --check "$file"
          done
      - name: Check basic HTML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          if not html.rstrip().lower().endswith("</html>"):
              raise SystemExit("index.html does not end with </html>")
          if html.lower().count("<script") != html.lower().count("</script>"):
              raise SystemExit("Script tag count mismatch")
          from html.parser import HTMLParser
          class IdChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.duplicates = set()
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          if value in self.ids:
                              self.duplicates.add(value)
                          self.ids.add(value)
          checker = IdChecker()
          checker.feed(html)
          if checker.duplicates:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(sorted(checker.duplicates)))
          print("Basic HTML structure and element IDs look consistent")
          required = [
              "async function onlineSave(",
              "async function onlineSync(",
              "async function onlineStartGame(",
              "async function onlineAwardPoint(",
              "async function onlineRematch(",
              "function onlineSubscribe(",
              "window.addEventListener('offline'",
              "window.addEventListener('online'",
              "let onlinePollGeneration = 0;",
              "let onlineVisibilityHandler = null;",
              "let onlineNetworkHandlersInstalled = false;",
              "if(!onlineNetworkHandlersInstalled){",
              "Leaving the screen must not hang while waiting for a flaky network.",
              "supabaseClient.rpc('leave_room', {",
              "A response from an old room/session must never affect the current screen.",
              "requestPlayerToken=online.playerToken",
              "requestPlayerToken!==online.playerToken",
              "async function onlineSync()",
              "async function onlineSave()",
              "const recoverLatestState=async()=>",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing critical online-game code: " + ", ".join(missing))
          if "if(!online.lastSaveConflict) online.state=previousState;" not in html:
              raise SystemExit("Missing conflict-safe rollback guard")
          sync_start = html.index("async function onlineSync()")
          sync_end = html.index("async function onlineSave()", sync_start)
          sync_code = html[sync_start:sync_end]
          if "pollGeneration!==onlinePollGeneration" not in sync_code or "if(pollGeneration===onlinePollGeneration) online.pollBusy=false" not in sync_code:
              raise SystemExit("Missing stale-subscription response guards")
          sync_catch = sync_code[sync_code.index("} catch(e) {"):sync_code.index("} finally {")]
          if "requestRoomId===online.roomId" not in sync_catch or "requestPlayerToken===online.playerToken" not in sync_catch:
              raise SystemExit("Stale polling errors must not change the active room connection status")
          save_start = html.index("async function onlineSave()")
          save_end = html.index("async function onlineFinishGame()", save_start)
          save_code = html[save_start:save_end]
          if "const recoverLatestState=async()=>{" not in save_code or "if(!isSameSession()) return false;" not in save_code:
              raise SystemExit("Missing guarded recovery of server state")
          if "finally {\n    if(isSameSession()) online.saving=false;\n  }" not in save_code:
              raise SystemExit("Missing session-safe save lock release")
          print("Critical online-game handlers and conflict guard are present")
          PY
